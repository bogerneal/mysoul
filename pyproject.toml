[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mysoul-weather"
version = "0.1.0"
description = "Taiwan weather forecast: offline data contract foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
weather-demo = "weather.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
